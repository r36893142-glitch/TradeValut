<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeVault</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0b0d10">
<style>
:root{--bg:#0b0d10;--p:#14171c;--p2:#1b1f26;--b:#272c35;--t:#e6e9ee;--m:#8a93a2;--g:#2fd47a;--r:#f0566a;--a:#3b82f6;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5f8;--p:#fff;--p2:#eef1f5;--b:#d5dae2;--t:#14171c;--m:#5d6675;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
nav{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--p);border-right:1px solid var(--b);padding:12px 8px;overflow:auto}
nav h1{font-size:17px;margin:4px 10px 12px;letter-spacing:.3px}nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--m);text-decoration:none;cursor:pointer}
nav a.on,nav a:hover{background:var(--p2);color:var(--t)}nav a.on{box-shadow:inset 3px 0 var(--a)}
main{margin-left:200px;padding:18px;max-width:1200px}
h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 8px;font-size:14px;color:var(--m);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:12px}.grid .card{margin:0}
.k{color:var(--m);font-size:12px}.v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.pos{color:var(--g)}.neg{color:var(--r)}
input,select,textarea,button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:64px}button{cursor:pointer}button.pri{background:var(--a);border-color:var(--a);color:#fff}button.dng{border-color:var(--r);color:var(--r)}
:focus-visible{outline:2px solid var(--a)}
label{display:flex;flex-direction:column;gap:3px;color:var(--m);font-size:12px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{color:var(--m);font-weight:600;cursor:pointer}
.sc{overflow-x:auto}.bar{height:8px;border-radius:4px;display:inline-block;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--p);border:1px solid var(--b);border-radius:6px;min-height:58px;padding:4px;font-size:11px;cursor:pointer}.cal .h{background:none;border:0;min-height:0;color:var(--m);text-align:center;cursor:default}
.warn{border-left:3px solid var(--r);background:var(--p2);padding:8px 10px;margin-bottom:8px;border-radius:4px}.ok{border-left:3px solid var(--g)}
img.s{max-width:100%;max-height:220px;border-radius:6px;margin-top:6px}
@media(max-width:760px){nav{position:static;width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--b);padding:6px}nav h1{display:none}nav a{white-space:nowrap}main{margin:0;padding:12px}}
</style></head><body><nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAGES=['Dashboard','Journal','Add Trade','Calendar','Analytics','Strategies','Lot Size Calculator','Risk Calculator','Trading Notes','Settings'];
const DEF={balance:10000,currency:'USD',risk:1,rr:2,theme:'dark',strategies:['ICT','SMC','Price Action','Breakout','Trend Following'],sessions:['Asian','London','New York','Overlap'],
 instruments:[{n:'EURUSD',m:'Forex',c:100000,pip:.0001,pv:10},{n:'XAUUSD',m:'Gold',c:100,pip:.1,pv:10},{n:'BTCUSD',m:'Crypto',c:1,pip:1,pv:1}],
 lim:{dayLoss:0,dayRisk:0,weekRisk:0,monthRisk:0,maxTrades:0,maxRisk:0}};
let S={...DEF},T=[],N={days:{},rules:'',pre:'',post:''},page='Dashboard',edit=null,sort={k:'date',d:-1},q='',calM=new Date(),calSel=null,db;
/* IndexedDB */
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('tradevault',1);r.onupgradeneeded=()=>{r.result.createObjectStore('trades',{keyPath:'id'});r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(st,m,f)=>new Promise((ok,no)=>{const t=db.transaction(st,m),o=t.objectStore(st),r=f(o);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)});
const saveT=t=>tx('trades','readwrite',o=>o.put(t)),delT=id=>tx('trades','readwrite',o=>o.delete(id)),clearAll=()=>Promise.all([tx('trades','readwrite',o=>o.clear()),tx('kv','readwrite',o=>o.clear())]);
const saveKV=()=>Promise.all([tx('kv','readwrite',o=>o.put(S,'settings')),tx('kv','readwrite',o=>o.put(N,'notes'))]);
async function load(){db=await open();T=await tx('trades','readonly',o=>o.getAll())||[];const s=await tx('kv','readonly',o=>o.get('settings')),n=await tx('kv','readonly',o=>o.get('notes'));if(s)S={...DEF,...s,lim:{...DEF.lim,...s.lim}};if(n)N={...N,...n};document.documentElement.dataset.theme=S.theme}
/* math */
const num=v=>{const x=parseFloat(v);return isNaN(x)?0:x},money=v=>(v<0?'-':'')+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),cls=v=>v>0?'pos':v<0?'neg':'';
const spec=n=>S.instruments.find(i=>i.n===n)||{c:1,pip:.0001,pv:0,m:'Custom'};
function calc(t){const s=spec(t.instrument),dir=t.side==='Sell'?-1:1,u=num(t.lots)*s.c;t.risk=Math.abs(num(t.entry)-num(t.sl))*u;t.reward=t.tp?Math.abs(num(t.tp)-num(t.entry))*u:0;
 if(t.pnlIn===''||t.pnlIn==null){t.pnl=t.exit?dir*(num(t.exit)-num(t.entry))*u:0}else t.pnl=num(t.pnlIn);
 t.riskPct=S.balance?t.risk/S.balance*100:0;t.rr=t.risk?t.reward/t.risk:0;t.r=t.risk?t.pnl/t.risk:0;t.result=!t.exit&&(t.pnlIn===''||t.pnlIn==null)?'Open':t.pnl>0?'Win':t.pnl<0?'Loss':'Breakeven';return t}
function stats(a){a=[...a].filter(t=>t.result!=='Open').sort((x,y)=>(x.date+x.id).localeCompare(y.date+y.id));const w=a.filter(t=>t.pnl>0),l=a.filter(t=>t.pnl<0),gp=w.reduce((s,t)=>s+t.pnl,0),gl=-l.reduce((s,t)=>s+t.pnl,0);
 let eq=0,pk=0,dd=0,curve=[0],ws=0,ls=0,mw=0,ml=0,cur=0;for(const t of a){eq+=t.pnl;curve.push(eq);pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);if(t.pnl>0){ws++;ls=0}else if(t.pnl<0){ls++;ws=0}else{ws=ls=0}mw=Math.max(mw,ws);ml=Math.max(ml,ls)}
 cur=ws?ws:-ls;const n=a.length,rs=a.filter(t=>t.risk>0);const aw=w.length?gp/w.length:0,al=l.length?gl/l.length:0,wr=n?w.length/n:0;
 return{n,gp,gl,net:gp-gl,wr,lr:n?l.length/n:0,pf:gl?gp/gl:gp?Infinity:0,avgR:rs.length?rs.reduce((s,t)=>s+t.r,0)/rs.length:0,avgRR:rs.length?rs.reduce((s,t)=>s+t.rr,0)/rs.length:0,aw,al,best:n?Math.max(...a.map(t=>t.pnl)):0,worst:n?Math.min(...a.map(t=>t.pnl)):0,dd,cur,mw,ml,exp:wr*aw-(1-wr)*al,curve}}
const sum=a=>a.reduce((s,t)=>s+t.pnl,0),by=(a,f)=>{const m={};a.filter(t=>t.result!=='Open').forEach(t=>(m[f(t)||'—']??=[]).push(t));return m};
const fx=v=>v===Infinity?'∞':v.toFixed(2);
/* charts */
function line(c){if(c.length<2)return'<p class="k">Close a trade to see the equity curve.</p>';const W=600,H=180,mn=Math.min(...c),mx=Math.max(...c),r=mx-mn||1,P=c.map((v,i)=>`${(i/(c.length-1)*W).toFixed(1)},${(H-(v-mn)/r*(H-10)-5).toFixed(1)}`).join(' '),z=H-(0-mn)/r*(H-10)-5;
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:190px"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--b)" stroke-dasharray="4"/><polyline fill="none" stroke="${c.at(-1)>=0?'var(--g)':'var(--r)'}" stroke-width="2" points="${P}"/></svg><div class="k">Low ${money(mn)} · High ${money(mx)}</div>`}
function bars(m,fmt=money){const e=Object.entries(m);if(!e.length)return'<p class="k">No data yet.</p>';const mx=Math.max(...e.map(([,v])=>Math.abs(v)))||1;return'<table>'+e.map(([k,v])=>`<tr><td>${esc(k)}</td><td style="width:60%"><span class="bar" style="width:${Math.abs(v)/mx*100}%;background:var(--${v>=0?'g':'r'})"></span></td><td class="${cls(v)}">${fmt(v)}</td></tr>`).join('')+'</table>'}
const wk=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
const card=(k,v,c='')=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
const tbl=a=>`<div class="sc"><table><tr><th>Date</th><th>Instrument</th><th>Side</th><th>Strategy</th><th>R</th><th>P&amp;L</th><th>Result</th></tr>${a.map(t=>`<tr><td>${t.date}</td><td>${esc(t.instrument)}</td><td>${t.side}</td><td>${esc(t.strategy)}</td><td>${t.r.toFixed(2)}</td><td class="${cls(t.pnl)}">${money(t.pnl)}</td><td>${t.result}</td></tr>`).join('')||'<tr><td colspan=7 class="k">No trades yet.</td></tr>'}</table></div>`;
/* pages */
const V={};
V.Dashboard=()=>{const s=stats(T),rec=[...T].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6),d=by(T,t=>t.date),mo=by(T,t=>t.date.slice(0,7)),M=o=>Object.fromEntries(Object.entries(o).sort().slice(-12).map(([k,v])=>[k,sum(v)]));
 return`<h2>Dashboard</h2><div class="grid">${card('Total trades',s.n)+card('Total profit',money(s.gp),'pos')+card('Total loss',money(-s.gl),'neg')+card('Net P&L',money(s.net),cls(s.net))+card('Win rate',(s.wr*100).toFixed(1)+'%')+card('Profit factor',fx(s.pf))+card('Average R:R',s.avgRR.toFixed(2))+card('Avg win',money(s.aw),'pos')+card('Avg loss',money(-s.al),'neg')+card('Best trade',money(s.best),'pos')+card('Worst trade',money(s.worst),'neg')+card('Max drawdown',money(-s.dd),'neg')+card('Current streak',(s.cur>0?s.cur+' wins':s.cur<0?-s.cur+' losses':'0'),cls(s.cur))}</div>
 <div class="card"><h3>Equity curve</h3>${line(s.curve)}</div><div class="card"><h3>Monthly performance</h3>${bars(M(mo))}</div><div class="card"><h3>Daily performance (last 14 days)</h3>${bars(Object.fromEntries(Object.entries(d).sort().slice(-14).map(([k,v])=>[k,sum(v)])))}</div><div class="card"><h3>Recent trades</h3>${tbl(rec)}</div>`};
V.Journal=()=>{let a=T.filter(t=>JSON.stringify(t).toLowerCase().includes(q.toLowerCase()));const f=$('#fs')?.value||'';if(f)a=a.filter(t=>t.result===f);a.sort((x,y)=>(x[sort.k]>y[sort.k]?1:-1)*sort.d);
 return`<h2>Journal</h2><div class="row"><input id="q" placeholder="Search trades" value="${esc(q)}"><select id="fs"><option value="">All results</option>${['Win','Loss','Breakeven','Open'].map(r=>`<option ${r===f?'selected':''}>${r}</option>`).join('')}</select><button data-a="csv">Export CSV</button></div>
 <div class="card sc"><table><tr>${[['date','Date'],['instrument','Instrument'],['side','Side'],['strategy','Strategy'],['r','R'],['pnl','P&L'],['result','Result']].map(([k,l])=>`<th data-sort="${k}">${l}${sort.k===k?sort.d>0?' ▲':' ▼':''}</th>`).join('')}<th></th></tr>${a.map(t=>`<tr><td>${t.date}</td><td>${esc(t.instrument)}</td><td>${t.side}</td><td>${esc(t.strategy)}</td><td>${t.r.toFixed(2)}</td><td class="${cls(t.pnl)}">${money(t.pnl)}</td><td>${t.result}</td><td><button data-a="view" data-id="${t.id}">View</button> <button data-a="edit" data-id="${t.id}">Edit</button> <button class="dng" data-a="del" data-id="${t.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=8 class="k">No trades. Use Add Trade to log your first one.</td></tr>'}</table></div><div id="det"></div>`};
const sel=(n,o,v)=>`<select name="${n}">${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`,inp=(l,n,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
V['Add Trade']=()=>{const t=edit?T.find(x=>x.id===edit):{date:new Date().toISOString().slice(0,10),side:'Buy',instrument:S.instruments[0]?.n,strategy:S.strategies[0],session:S.sessions[0],tf:'H1',pnlIn:''};
 return`<h2>${edit?'Edit':'Add'} trade</h2><form id="tf" class="card"><div class="f">${inp('Date','date',t.date,'date','required')}<label>Instrument${sel('instrument',S.instruments.map(i=>i.n),t.instrument)}</label><label>Side${sel('side',['Buy','Sell'],t.side)}</label>${inp('Entry price','entry',t.entry,'number','step=any required')}${inp('Stop loss','sl',t.sl,'number','step=any required')}${inp('Take profit','tp',t.tp,'number','step=any')}${inp('Exit price','exit',t.exit,'number','step=any')}${inp('Lot size','lots',t.lots,'number','step=any required')}${inp('Actual P&L (optional override)','pnlIn',t.pnlIn,'number','step=any')}<label>Strategy${sel('strategy',S.strategies,t.strategy)}</label>${inp('Timeframe','tf',t.tf)}<label>Session${sel('session',S.sessions,t.session)}</label>${inp('Emotions','emotions',t.emotions)}</div>
 <div class="f" style="margin-top:10px"><label>Mistakes<textarea name="mistakes">${esc(t.mistakes)}</textarea></label><label>Lessons learned<textarea name="lessons">${esc(t.lessons)}</textarea></label><label>Notes<textarea name="notes">${esc(t.notes)}</textarea></label></div>
 <div class="f" style="margin-top:10px"><label>Before-trade screenshot<input type="file" accept="image/*" data-img="before"></label><label>After-trade screenshot<input type="file" accept="image/*" data-img="after"></label></div><div id="prev">${t.before?`<img class="s" src="${t.before}">`:''}${t.after?`<img class="s" src="${t.after}">`:''}</div>
 <p class="k" id="pv"></p><div class="row"><button class="pri">Save trade</button>${edit?'<button type="button" data-a="cancel">Cancel</button>':''}</div></form>`};
V.Calendar=()=>{const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),pre=`${y}-${String(m+1).padStart(2,'0')}`,d=by(T,t=>t.date),mt=T.filter(t=>t.date.startsWith(pre));let h='',wd=0,ld=0;
 for(let i=0;i<off;i++)h+='<div style="visibility:hidden"></div>';for(let i=1;i<=dim;i++){const k=`${pre}-${String(i).padStart(2,'0')}`,a=d[k],p=a?sum(a):0;if(a){p>0?wd++:p<0&&ld++}h+=`<div data-day="${k}" style="${a?`border-color:var(--${p>=0?'g':'r'})`:''}${calSel===k?';outline:2px solid var(--a)':''}">${i}${a?`<br><b class="${cls(p)}">${money(p)}</b><br>${a.length} trade${a.length>1?'s':''}`:''}</div>`}
 const ex=calSel?T.filter(t=>t.date===calSel):[];return`<h2>Calendar</h2><div class="row"><button data-a="pm">◀</button><b>${first.toLocaleString(undefined,{month:'long',year:'numeric'})}</b><button data-a="nm">▶</button></div><div class="grid">${card('Month P&L',money(sum(mt.filter(t=>t.result!=='Open'))),cls(sum(mt)))+card('Trades',mt.length)+card('Winning days',wd,'pos')+card('Losing days',ld,'neg')+card('No-trade days',dim-Object.keys(d).filter(k=>k.startsWith(pre)).length)}</div><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('')}${h}</div>${calSel?`<div class="card" style="margin-top:12px"><h3>${calSel}</h3>${tbl(ex)}</div>`:''}`};
V.Analytics=()=>{const s=stats(T),g=(f)=>bars(Object.fromEntries(Object.entries(by(T,f)).map(([k,v])=>[k,sum(v)]))),W=by(T,t=>wk(t.date)),D=by(T,t=>t.date);
 return`<h2>Analytics</h2><div class="grid">${card('Win rate',(s.wr*100).toFixed(1)+'%')+card('Loss rate',(s.lr*100).toFixed(1)+'%')+card('Expectancy',money(s.exp),cls(s.exp))+card('Profit factor',fx(s.pf))+card('Max drawdown',money(-s.dd),'neg')+card('Average R',s.avgR.toFixed(2))+card('Average win',money(s.aw),'pos')+card('Average loss',money(-s.al),'neg')+card('Gross profit',money(s.gp),'pos')+card('Gross loss',money(-s.gl),'neg')+card('Net profit',money(s.net),cls(s.net))+card('Win streak',s.mw)+card('Loss streak',s.ml)}</div>
 <div class="card"><h3>Equity curve</h3>${line(s.curve)}</div>${[['Monthly',g(t=>t.date.slice(0,7))],['Weekly (week starting)',bars(Object.fromEntries(Object.entries(W).sort().map(([k,v])=>[k,sum(v)])))],['Daily',bars(Object.fromEntries(Object.entries(D).sort().slice(-30).map(([k,v])=>[k,sum(v)])))],['Strategy',g(t=>t.strategy)],['Instrument',g(t=>t.instrument)],['Buy vs Sell',g(t=>t.side)],['Session',g(t=>t.session)],['Timeframe',g(t=>t.tf)]].map(([l,h])=>`<div class="card"><h3>${l}</h3>${h}</div>`).join('')}`};
V.Strategies=()=>{const m=by(T,t=>t.strategy);return`<h2>Strategies</h2><form id="sf" class="row"><input name="n" placeholder="New strategy name" required><button class="pri">Add strategy</button></form><div class="card sc"><table><tr><th>Strategy</th><th>Trades</th><th>Win rate</th><th>Profit factor</th><th>Avg R</th><th>Net</th><th>Avg win</th><th>Avg loss</th><th></th></tr>${S.strategies.map(n=>{const s=stats(m[n]||[]);return`<tr><td>${esc(n)}</td><td>${s.n}</td><td>${(s.wr*100).toFixed(1)}%</td><td>${fx(s.pf)}</td><td>${s.avgR.toFixed(2)}</td><td class="${cls(s.net)}">${money(s.net)}</td><td>${money(s.aw)}</td><td>${money(-s.al)}</td><td><button class="dng" data-a="rs" data-n="${esc(n)}">Remove</button></td></tr>`}).join('')}</table></div>`};
V['Lot Size Calculator']=()=>`<h2>Lot size calculator</h2><div class="card"><div class="f"><label>Instrument<select id="li">${S.instruments.map(i=>`<option>${esc(i.n)}</option>`).join('')}</select></label>${inp('Account balance','bal',S.balance,'number','step=any')}${inp('Risk %','rp',S.risk,'number','step=any')}${inp('Entry price','en','','number','step=any')}${inp('Stop loss','sl','','number','step=any')}${inp('Take profit','tp','','number','step=any')}${inp('Contract size','cs','','number','step=any')}${inp('Pip size','ps','','number','step=any')}${inp('Pip value per lot ('+S.currency+') — optional','pv','','number','step=any')}</div><p class="k">Leave contract specs blank to use the instrument's saved values. If pip value is set, lots = risk ÷ (pips × pip value); otherwise lots = risk ÷ (distance × contract size).</p></div><div id="lr" class="grid"></div>`;
V['Risk Calculator']=()=>{const td=new Date().toISOString().slice(0,10),L=S.lim,per=(f)=>T.filter(f),d=per(t=>t.date===td),w=per(t=>wk(t.date)===wk(td)),mo=per(t=>t.date.slice(0,7)===td.slice(0,7)),rk=a=>a.reduce((s,t)=>s+t.risk,0),W=[];
 if(L.dayLoss&&-sum(d)>=L.dayLoss)W.push('Daily loss limit reached: stop trading today.');if(L.maxTrades&&d.length>=L.maxTrades)W.push(`Maximum trades per day reached (${d.length}/${L.maxTrades}).`);if(L.dayRisk&&rk(d)>L.dayRisk)W.push('Daily risk limit exceeded.');if(L.weekRisk&&rk(w)>L.weekRisk)W.push('Weekly risk limit exceeded.');if(L.monthRisk&&rk(mo)>L.monthRisk)W.push('Monthly risk limit exceeded.');
 T.filter(t=>L.maxRisk&&t.riskPct>L.maxRisk&&t.date===td).forEach(t=>W.push(`${t.instrument} risks ${t.riskPct.toFixed(2)}% (max ${L.maxRisk}%).`));
 return`<h2>Risk management</h2>${W.map(x=>`<div class="warn">${esc(x)}</div>`).join('')||'<div class="warn ok">All limits respected. Set limits in Settings (0 = off).</div>'}<div class="grid">${card('Today P&L',money(sum(d)),cls(sum(d)))+card('Today trades',d.length)+card('Today risk',money(rk(d)))+card('Week risk',money(rk(w)))+card('Month risk',money(rk(mo)))}</div>
 <div class="card"><h3>Risk-reward calculator</h3><div class="f">${inp('Entry','e','','number','step=any')}${inp('Stop loss','s','','number','step=any')}${inp('Take profit','t','','number','step=any')}${inp('Risk amount','ra',S.balance*S.risk/100,'number','step=any')}</div><div id="rr" class="grid" style="margin-top:10px"></div></div>`};
V['Trading Notes']=()=>{const td=new Date().toISOString().slice(0,10),d=N.days[td]||{};return`<h2>Trading notes</h2><div class="card"><h3>Daily journal · <input type="date" id="nd" value="${td}"></h3><div class="f"><label>Discipline score (0–10)<input type="number" min="0" max="10" id="ndis" value="${d.dis??''}"></label><label>Emotions<input id="nem" value="${esc(d.em)}"></label></div><label>Journal<textarea id="ntx">${esc(d.text)}</textarea></label><label>Mistakes &amp; lessons<textarea id="nls">${esc(d.les)}</textarea></label></div><div class="card"><h3>Checklists &amp; rules</h3><label>Pre-trade checklist<textarea data-n="pre">${esc(N.pre)}</textarea></label><label>Post-trade checklist<textarea data-n="post">${esc(N.post)}</textarea></label><label>Personal trading rules<textarea data-n="rules">${esc(N.rules)}</textarea></label></div><div class="card"><h3>Past entries</h3>${Object.entries(N.days).sort().reverse().map(([k,v])=>`<p><b>${k}</b> · discipline ${v.dis??'—'} · ${esc(v.em)}<br>${esc(v.text)}</p>`).join('')||'<p class="k">No entries yet.</p>'}</div>`};
V.Settings=()=>{const L=S.lim;return`<h2>Settings</h2><form id="st" class="card"><h3>Account</h3><div class="f">${inp('Account balance','balance',S.balance,'number','step=any')}${inp('Currency','currency',S.currency)}${inp('Default risk %','risk',S.risk,'number','step=any')}${inp('Default risk-reward','rr',S.rr,'number','step=any')}<label>Theme${sel('theme',['dark','light'],S.theme)}</label></div><h3 style="margin-top:12px">Risk limits (0 = off)</h3><div class="f">${[['dayLoss','Daily loss limit'],['dayRisk','Daily risk limit'],['weekRisk','Weekly risk limit'],['monthRisk','Monthly risk limit'],['maxTrades','Max trades per day'],['maxRisk','Max risk % per trade']].map(([k,l])=>inp(l,'L_'+k,L[k],'number','step=any')).join('')}</div><h3 style="margin-top:12px">Sessions (comma separated)</h3>${inp('','sessions',S.sessions.join(', '))}<div class="row" style="margin-top:10px"><button class="pri">Save settings</button></div></form>
 <div class="card"><h3>Instruments &amp; contract specifications</h3><div class="sc"><table><tr><th>Name</th><th>Market</th><th>Contract size</th><th>Pip size</th><th>Pip value/lot</th><th></th></tr>${S.instruments.map((i,x)=>`<tr><td>${esc(i.n)}</td><td>${esc(i.m)}</td><td>${i.c}</td><td>${i.pip}</td><td>${i.pv}</td><td><button class="dng" data-a="ri" data-i="${x}">Remove</button></td></tr>`).join('')}</table></div><form id="if" class="f" style="margin-top:10px">${inp('Name','n','','text','required')}<label>Market${sel('m',['Forex','Gold','Crypto','Custom'],'Forex')}</label>${inp('Contract size','c','100000','number','step=any required')}${inp('Pip size','pip','0.0001','number','step=any')}${inp('Pip value per lot','pv','10','number','step=any')}<button class="pri" style="align-self:end">Add / update instrument</button></form></div>
 <div class="card"><h3>Backup &amp; data</h3><div class="row"><button data-a="csv">Export trades CSV</button><label style="flex-direction:row;align-items:center">Import CSV <input type="file" accept=".csv" data-imp="csv"></label></div><div class="row"><button data-a="json">Full JSON backup</button><label style="flex-direction:row;align-items:center">Restore JSON <input type="file" accept=".json" data-imp="json"></label><button data-a="sjson">Export settings</button></div><div class="row"><button class="dng" data-a="wipe">Delete all data</button></div></div>`};
/* csv */
const COLS=['id','date','instrument','side','entry','sl','tp','exit','lots','pnlIn','strategy','tf','session','emotions','mistakes','lessons','notes'];
const csvOut=()=>[COLS.join(',')].concat(T.map(t=>COLS.map(c=>'"'+String(t[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
function csvIn(s){const r=[];let row=[],c='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch=='"'){if(s[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&s[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.length>1)}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
const shrink=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)});
/* render + events */
function render(){$('#nav').innerHTML='<h1>TradeVault</h1>'+PAGES.map(p=>`<a class="${p===page?'on':''}" data-p="${p}">${p}</a>`).join('');$('#app').innerHTML=V[page]();if(page==='Lot Size Calculator')lot();if(page==='Risk Calculator')rr()}
function lot(){const g=id=>$('#'+id).value,i=spec(g('li')),bal=num(g('bal')),rp=num(g('rp')),en=num(g('en')),sl=num(g('sl')),tp=num(g('tp')),cs=num(g('cs'))||i.c,ps=num(g('ps'))||i.pip,pv=num(g('pv'))||0,risk=bal*rp/100,dist=Math.abs(en-sl);let lots=0;
 if(dist>0){lots=pv>0?risk/((dist/ps)*pv):risk/(dist*cs)}const u=lots*cs,pl=tp&&dist?Math.abs(tp-en)*u:0;$('#lr').innerHTML=card('Risk amount',money(risk)+' '+S.currency)+card('Stop distance',dist?dist.toFixed(5)+' ('+(dist/ps).toFixed(1)+' pips)':'—')+card('Lots',lots?lots.toFixed(2):'—')+card('Units',lots?u.toFixed(2):'—')+card('Potential loss',money(-risk),'neg')+card('Potential profit',pl?money(pl):'—','pos')+card('Risk-reward',pl&&risk?(pl/risk).toFixed(2):'—')}
function rr(){const g=id=>num($('#'+id).value),e=g('e'),s=g('s'),t=g('t'),ra=g('ra'),r=Math.abs(e-s),w=Math.abs(t-e);$('#rr').innerHTML=card('Risk-reward',r&&t?'1 : '+(w/r).toFixed(2):'—')+card('Potential profit',r&&t?money(ra*w/r):'—','pos')+card('Potential loss',money(-ra),'neg')+card('Break-even win rate',r&&t?(100/(1+w/r)).toFixed(1)+'%':'—')}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-p],[data-a],[data-sort],[data-day]');if(!el)return;const D=el.dataset;
 if(D.p){page=D.p;edit=null;return render()}if(D.sort){sort={k:D.sort,d:sort.k===D.sort?-sort.d:1};return render()}if(D.day){calSel=D.day;return render()}
 const id=D.id,a=D.a;if(a==='pm'||a==='nm'){calM=new Date(calM.getFullYear(),calM.getMonth()+(a==='pm'?-1:1),1);return render()}
 if(a==='edit'){edit=id;page='Add Trade';return render()}if(a==='cancel'){edit=null;page='Journal';return render()}
 if(a==='view'){const t=T.find(x=>x.id===id);$('#det').innerHTML=`<div class="card"><h3>${esc(t.instrument)} ${t.side} · ${t.date}</h3><p>Entry ${t.entry} · SL ${t.sl} · TP ${t.tp||'—'} · Exit ${t.exit||'—'} · Lots ${t.lots}<br>Risk ${money(t.risk)} (${t.riskPct.toFixed(2)}%) · Reward ${money(t.reward)} · R:R ${t.rr.toFixed(2)} · Session ${esc(t.session)} · TF ${esc(t.tf)}<br>Emotions: ${esc(t.emotions)}</p><p>Mistakes: ${esc(t.mistakes)}<br>Lessons: ${esc(t.lessons)}<br>Notes: ${esc(t.notes)}</p>${t.before?`<img class="s" src="${t.before}">`:''}${t.after?`<img class="s" src="${t.after}">`:''}${t.before||t.after?`<div><button class="dng" data-a="rimg" data-id="${t.id}">Delete screenshots</button></div>`:''}</div>`;return}
 if(a==='rimg'){const t=T.find(x=>x.id===id);delete t.before;delete t.after;await saveT(t);return render()}
 if(a==='del'&&confirm('Delete this trade?')){await delT(id);T=T.filter(t=>t.id!==id);return render()}
 if(a==='rs'){S.strategies=S.strategies.filter(x=>x!==D.n);await saveKV();return render()}if(a==='ri'){S.instruments.splice(+D.i,1);await saveKV();return render()}
 if(a==='csv')dl('tradevault-trades.csv',csvOut(),'text/csv');
 if(a==='json'){const b=await Promise.all([]);dl('tradevault-backup.json',JSON.stringify({v:1,settings:S,notes:N,trades:T}),'application/json')}
 if(a==='sjson')dl('tradevault-settings.json',JSON.stringify(S),'application/json');
 if(a==='wipe'&&confirm('Delete ALL trades, notes and settings? This cannot be undone.')&&prompt('Type DELETE to confirm')==='DELETE'){await clearAll();S={...DEF};T=[];N={days:{},rules:'',pre:'',post:''};render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;const p=t.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)}else if(t.id==='fs')render();
 else if(page==='Lot Size Calculator'&&t.closest('.card'))lot();else if(page==='Risk Calculator')rr();
 else if(t.dataset.n){N[t.dataset.n]=t.value;saveKV()}else if(['ndis','nem','ntx','nls'].includes(t.id)||t.id==='nd'&&0){const k=$('#nd').value;N.days[k]={dis:$('#ndis').value,em:$('#nem').value,text:$('#ntx').value,les:$('#nls').value};saveKV()}
 else if(t.closest('#tf')){const f=new FormData($('#tf')),o=calc(Object.fromEntries(f));$('#pv').textContent=o.risk?`Risk ${money(o.risk)} (${o.riskPct.toFixed(2)}%) · R:R ${o.rr.toFixed(2)} · P&L ${money(o.pnl)}`:''}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='li'){lot();return}if(t.id==='nd'){const d=N.days[t.value]||{};$('#ndis').value=d.dis??'';$('#nem').value=d.em||'';$('#ntx').value=d.text||'';$('#nls').value=d.les||'';return}
 if(t.dataset.img&&t.files[0]){window._img=window._img||{};window._img[t.dataset.img]=await shrink(t.files[0]);$('#prev').innerHTML+=`<img class="s" src="${window._img[t.dataset.img]}">`}
 if(t.dataset.imp&&t.files[0]){const s=await t.files[0].text();try{if(t.dataset.imp==='json'){const j=JSON.parse(s);if(!confirm('Restore backup? This replaces current data.'))return;await clearAll();S={...DEF,...j.settings};N=j.notes||N;T=(j.trades||[]).map(calc);for(const x of T)await saveT(x);await saveKV()}
  else{const r=csvIn(s),h=r.shift();let n=0;for(const row of r){const o={};h.forEach((c,i)=>o[c.trim()]=row[i]);if(!o.date||!o.entry)continue;o.id=o.id||crypto.randomUUID();o.instrument=o.instrument||'UNKNOWN';if(!S.instruments.some(i=>i.n===o.instrument))S.instruments.push({n:o.instrument,m:'Custom',c:1,pip:.0001,pv:0});const old=T.findIndex(x=>x.id===o.id);const c=calc(o);if(old>=0)T[old]={...T[old],...c};else T.push(c);await saveT(old>=0?T[old]:c);n++}await saveKV();alert(n+' trades imported')}render()}catch(err){alert('Import failed: '+err.message)}t.value=''}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,o=Object.fromEntries(new FormData(f));
 if(f.id==='tf'){const old=edit?T.find(x=>x.id===edit):{};const t=calc({...old,...o,id:old.id||crypto.randomUUID(),...(window._img||{})});window._img=null;await saveT(t);if(edit)T=T.map(x=>x.id===t.id?t:x);else T.push(t);edit=null;page='Journal'}
 else if(f.id==='sf'){if(!S.strategies.includes(o.n))S.strategies.push(o.n.trim());await saveKV()}
 else if(f.id==='if'){const i={n:o.n.trim().toUpperCase(),m:o.m,c:num(o.c)||1,pip:num(o.pip)||.0001,pv:num(o.pv)};S.instruments=S.instruments.filter(x=>x.n!==i.n).concat(i);await saveKV()}
 else if(f.id==='st'){for(const k of['balance','risk','rr'])S[k]=num(o[k]);S.currency=o.currency;S.theme=o.theme;S.sessions=o.sessions.split(',').map(x=>x.trim()).filter(Boolean);for(const k of Object.keys(S.lim))S.lim[k]=num(o['L_'+k]);document.documentElement.dataset.theme=S.theme;T=T.map(calc);for(const t of T)await saveT(t);await saveKV()}
 render()});
load().then(render);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
